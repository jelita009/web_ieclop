<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galery - UKM IECLOP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <link rel="stylesheet" href="galery.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/memoryPage.css">
    <link rel="stylesheet" href="../animation.css">
</head>
<body class="text-white antialiased bg-[#050b1d]">
    
    <!-- Background Video -->
    <video autoplay muted loop playsinline class="video-bg">
        <source src="../video/contoh.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Navbar Utama -->
    <main-navbar class="relative z-[100]"></main-navbar>

    <!-- Konten Utama Galeri -->
    <main class="relative z-10 max-w-[1400px] mx-auto px-4 sm:px-6 pt-32 pb-24">
        
        <!-- Judul Halaman -->
        <div class="text-center mb-10" data-aos="fade-down">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 uppercase text-glow">
                Kegiatan UKM IECLOP 2026
            </h1>
            <p class="text-gray-400 mt-3 text-sm md:text-base max-w-xl mx-auto">
                Kumpulan dokumentasi kegiatan seluruh keluarga besar UKM IECLOP.
            </p>
            <div class="w-24 h-1 bg-gradient-to-r from-blue-500 to-indigo-500 mx-auto mt-4 rounded-full"></div>
        </div>

        <!-- ==========================================
             TEMPAT MENAMBAHKAN FOTO (KHUSUS HALAMAN INI)
             Tinggal tambah baris di dalam tanda [ ... ] di bawah ini.
             Pastikan baris terakhir tidak menggunakan tanda koma ( , )
        ========================================== -->
        <script type="application/json" id="gallery-data">
        [
            { "src": "../img/memories/L11.jpg", "alt": "Event Dokumentasi 1" },
            { "src": "../img/memories/P24.JPG", "alt": "Rapat Evaluasi Kerja Infocom" }
        ]
        </script>

        <!-- Grid Foto Dinamis (Akan diisi otomatis oleh JS) -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
            <!-- Data foto di-render otomatis berdasarkan data script diatas -->
        </div>
    </main>

    <!-- Lightbox Modal Modern -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-controls">
            <span class="img-counter text-sm tracking-widest text-gray-400 font-mono">IMAGE VIEW</span>
            <span class="close-btn"><i class="bi bi-x-lg"></i></span>
        </div>
        <div class="lightbox-wrapper">
            <img class="lightbox-content" id="lightbox-img" src="" alt="">
            <div id="caption" class="text-center mt-4 text-sm md:text-base font-medium tracking-wide text-gray-200"></div>
        </div>
    </div>

    <!-- Bingkai Footer Otomatis -->
    <main-footer></main-footer>

    <!-- Urutan Pemanggilan Script untuk Keamanan Render & Animasi -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="galery.js"></script>
    <script src="../translate.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../script.js"></script>
</body>
</html>
