<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - IECLOP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link pemanggil Ikon & Animasi AOS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
    
    <!-- Favicon / Tab Logo -->
    <link rel="icon" type="image/webp" href="img/logo_IECLOP.webp">
    <link rel="shortcut icon" type="image/webp" href="img/logo_IECLOP.webp">
    <link rel="apple-touch-icon" href="img/logo_IECLOP.webp">
    <style>
        .login-box {
            background: rgba(10, 20, 50, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
        }
        input:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            background: rgba(255, 255, 255, 0.1) !important;
        }
        .lang-container-absolute {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 50;
        }
    </style>
</head>

<body class="text-white antialiased min-h-screen flex flex-col overflow-x-hidden">
    
    <video autoplay muted loop playsinline preload="auto" controlsList="nodownload" disablePictureInPicture class="video-bg">
        <source src="https://github.com/jelita009/web_ieclop/releases/download/assets-v1/video-profil-ieclop-2026.mp4" type="video/mp4">
        <source src="video/VIDEO%20PROFIL%20UKM%20IECLOP%20PNL%20-%202026_2.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Tombol Kontrol Video Background -->
    <button id="video-ctrl-btn" class="video-control-btn" aria-label="Jeda Video Latar Belakang" title="Jeda Video Latar Belakang">
        <i class="fa-solid fa-pause"></i>
    </button>

    <div class="lang-container-absolute">
        <div class="lang-container">
            <span onclick="changeLanguage('id')" id="btn-id" class="lang-link lang-active">ID</span>
            <span class="text-gray-500">|</span>
            <span onclick="changeLanguage('en')" id="btn-en" class="lang-link">EN</span>
        </div>
    </div>

    <!-- Main content -->
    <main class="flex-grow flex items-center justify-center p-6 relative z-10 w-full">
        <div class="login-box p-10 w-full max-w-md text-center" data-aos="zoom-in">
            <img src="img/logo_IECLOP.webp" class="h-16 mx-auto mb-6" alt="Logo" onerror="this.src='img/logo_IECLOP.webp'">
            <h2 class="text-3xl font-black mb-2 tracking-tighter text-white" data-i18n="adminTitle">ADMIN PANEL</h2>
            <p class="text-blue-200 mb-8 text-sm opacity-80" data-i18n="adminDesc">Silakan masuk untuk mengelola tugas divisi.</p>
            
            <form id="login-form" class="space-y-4">
                <input type="email" id="username" placeholder="Email Admin" autocomplete="username" required class="w-full p-4 rounded-xl outline-none transition">
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required class="w-full p-4 rounded-xl outline-none transition">
                <button type="submit" id="login-submit-btn" class="w-full bg-[#1e3a8a] hover:bg-[#172a6b] py-4 rounded-xl font-bold transition transform hover:scale-105 shadow-[0_4px_15px_rgba(30,58,138,0.4)]" data-i18n="adminBtn">
                    MASUK SEKARANG
                </button>
            </form>
            <a href="index.html" class="inline-block mt-6 text-xs text-blue-300 hover:text-white transition uppercase tracking-wider font-bold" data-i18n="adminBack">KEMBALI KE BERANDA</a>
        </div>
    </main>

    <!-- Bingkai Footer Otomatis -->
    <main-footer></main-footer>

    <!-- Script pemanggil Animasi AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        // --- FITUR PENYAMBUNG VIDEO BACKGROUND ---
        document.addEventListener("DOMContentLoaded", () => {
            const bgVideo = document.querySelector('.video-bg');
            if (bgVideo) {
                const savedTime = sessionStorage.getItem('bgVideoTime');
                if (savedTime !== null) bgVideo.currentTime = parseFloat(savedTime);
                window.addEventListener('beforeunload', () => {
                    sessionStorage.setItem('bgVideoTime', bgVideo.currentTime);
                });
            }
        });
    </script>
    <script src="js/supabase-config.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-submit-btn');

        // Cek jika sudah login, langsung arahkan ke admin.html
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.replace("admin.html");
        })();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Mencegah reload halaman bawaan form

            const email = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Email dan password wajib diisi!");
                return;
            }

            const originalText = loginBtn.innerText;
            loginBtn.innerText = "MEMPROSES...";
            loginBtn.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert("Login gagal: " + error.message);
                loginBtn.innerText = originalText;
                loginBtn.disabled = false;
            } else {
                window.location.replace("admin.html");
            }
        });
    </script>
    <script src="js/translate.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
