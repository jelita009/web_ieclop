<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Regeneration - UKM IECLOP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/gallery.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animation.css">
    
    <!-- Favicon / Tab Logo -->
    <link rel="icon" type="image/webp" href="../img/logo_IECLOP.webp">
    <link rel="shortcut icon" type="image/webp" href="../img/logo_IECLOP.webp">
    <link rel="apple-touch-icon" href="../img/logo_IECLOP.webp">
</head>
<body class="text-white antialiased bg-[#050b1d]">
    
    <!-- Background Video -->
    <video autoplay muted loop playsinline preload="auto" controlsList="nodownload" disablePictureInPicture class="video-bg">
        <source src="../video/VIDEO%20PROFIL%20UKM%20IECLOP%20PNL%20-%202026_2.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Navbar Utama -->
    <main-navbar class="relative z-[100]"></main-navbar>

    <!-- Konten Utama Galeri Divisi -->
    <main class="relative z-10 max-w-[1400px] mx-auto px-4 sm:px-6 pt-32 pb-24">
        
        <!-- Tombol Kembali -->
        <div class="mb-6" data-aos="fade-right">
            <a href="../gallery.html" class="inline-flex items-center gap-2 bg-white/10 hover:bg-blue-600/80 text-white text-xs font-bold px-4 py-2.5 rounded-full border border-white/20 transition shadow-lg backdrop-blur-md" data-i18n="btnBackToGallery">
                ← Kembali ke Galeri Utama
            </a>
        </div>

        <!-- Judul Halaman -->
        <div class="text-center mb-12" data-aos="fade-down">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 uppercase text-glow">
                Galeri Divisi Regeneration
            </h1>
            <p class="text-gray-300 mt-3 text-sm md:text-base max-w-xl mx-auto">
                Dokumentasi Open Recruitment, HOCO, Internship, PDH Day, IBOUND, dan Keakraban Kader.
            </p>
            <div class="w-24 h-1 bg-gradient-to-r from-blue-500 to-indigo-500 mx-auto mt-4 rounded-full"></div>
        </div>

        <!-- DATA FOTO PROGRAM KERJA DIVISI REGENERATION -->
        <script type="application/json" id="gallery-data">
        [
    {
        "title": "Open Recruitment",
        "folder": "open-recruitment",
        "cover": "../img/REGENERATION.webp",
        "photos": []
    },
    {
        "title": "Keep In Touch",
        "folder": "keep-in-touch",
        "cover": "../img/REGENERATION.webp",
        "photos": []
    },
    {
        "title": "HOCO",
        "folder": "hoco",
        "cover": "../img/REGENERATION.webp",
        "photos": []
    },
    {
        "title": "Internship",
        "folder": "internship",
        "cover": "../img/REGENERATION.webp",
        "photos": []
    },
    {
        "title": "PDH DAY",
        "folder": "pdh-day",
        "cover": "../img/REGENERATION.webp",
        "photos": []
    },
    {
        "title": "IBOUND",
        "folder": "ibound",
        "cover": "../img/REGENERATION.webp",
        "photos": []
    },
    {
        "title": "IE-GREET",
        "folder": "ie-greet",
        "cover": "../img/REGENERATION.webp",
        "photos": []
    },
    {
        "title": "I-Anniversary",
        "folder": "i-anniversary",
        "cover": "../img/REGENERATION.webp",
        "photos": []
    }
]
        </script>

        <!-- Grid Foto Dinamis -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div>
    </main>

    <!-- Lightbox Modal Modern -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-controls">
            <span class="img-counter text-sm tracking-widest text-gray-400 font-mono">IMAGE VIEW</span>
            <span class="close-btn"><i class="bi bi-x-lg"></i></span>
        </div>
        <div class="lightbox-wrapper">
            <img class="lightbox-content" id="lightbox-img" src="" alt="">
            <div id="caption" class="text-center mt-4 text-sm md:text-base font-medium tracking-wide text-gray-200"></div>
        </div>
    </div>

    <!-- Bingkai Footer Otomatis -->
    <main-footer></main-footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../js/gallery.js"></script>
    <script src="../js/translate.js"></script>
    <script src="../js/navbar.js?v=2"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
