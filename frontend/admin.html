<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - IECLOP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
    
    <!-- Favicon / Tab Logo -->
    <link rel="icon" type="image/webp" href="img/logo_IECLOP.webp">
    <link rel="shortcut icon" type="image/webp" href="img/logo_IECLOP.webp">
    <link rel="apple-touch-icon" href="img/logo_IECLOP.webp">
    
    <style>
        body.auth-checking { display: none; }
        .admin-card { 
            background: rgba(10, 20, 50, 0.4); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .task-item { 
            display: flex; 
            align-items: center; 
            padding: 12px; 
            border-radius: 12px; 
            background: rgba(255, 255, 255, 0.05); 
            margin-bottom: 8px; 
            cursor: pointer; 
            transition: 0.3s; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .task-item:hover { 
            background: rgba(255, 255, 255, 0.1); 
            border-color: rgba(59, 130, 246, 0.3);
        }
        input[type="checkbox"] { 
            width: 18px; 
            height: 18px; 
            accent-color: #1e3a8a; 
            margin-right: 15px; 
            cursor: pointer;
        }
    </style>
</head>
<body class="text-white antialiased min-h-screen relative overflow-x-hidden auth-checking">
    
    <video autoplay muted loop playsinline preload="auto" controlsList="nodownload" disablePictureInPicture class="video-bg">
        <source src="https://github.com/jelita009/web_ieclop/releases/download/assets-v1/video-profil-ieclop-2026.mp4" type="video/mp4">
        <source src="video/VIDEO%20PROFIL%20UKM%20IECLOP%20PNL%20-%202026_2.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Tombol Kontrol Video Background -->
    <button id="video-ctrl-btn" class="video-control-btn" aria-label="Jeda Video Latar Belakang" title="Jeda Video Latar Belakang">
        <i class="fa-solid fa-pause"></i>
    </button>

    <nav class="p-6 flex flex-col md:flex-row justify-between items-center max-w-6xl mx-auto mb-6 relative z-10 gap-6 pt-10">
        <span class="text-2xl md:text-3xl font-black uppercase tracking-tighter" data-i18n="adminDashTitle">
            ADMIN <span class="text-blue-300">DASHBOARD</span>
        </span>
        
        <div class="flex items-center gap-5 flex-wrap justify-center">
            <div class="lang-container">
                <span onclick="changeLanguage('id')" id="btn-id" class="lang-link lang-active">ID</span>
                <span class="text-gray-500">|</span>
                <span onclick="changeLanguage('en')" id="btn-en" class="lang-link">EN</span>
            </div>
            
            <button onclick="resetProgress()" class="text-xs text-blue-200 underline hover:text-white transition uppercase font-bold tracking-wider" data-i18n="adminDashReset">RESET SEMUA</button>
            <button onclick="logout()" class="bg-red-500/20 text-red-400 px-4 py-2.5 rounded-lg text-xs font-bold border border-red-500/30 hover:bg-red-500 hover:text-white transition shadow-lg tracking-widest" data-i18n="adminDashLogout">KELUAR</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pb-20 relative z-10">
        <header class="mb-10 text-center md:text-left">
            <h1 class="text-4xl md:text-5xl font-black mb-3 uppercase tracking-tight" data-i18n="adminDashHeader">Manajemen Proker Divisi</h1>
            <p class="text-blue-100 opacity-90 text-lg" data-i18n="adminDashSub">Centang untuk mengubah status menjadi "Terlaksana" di halaman publik.</p>
        </header>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="admin-task-container"></div>
    </main>

    <!-- Bingkai Footer Otomatis -->
    <main-footer></main-footer>

    <script src="js/supabase-config.js"></script>
    <script>
        let allTasksFromDB = [];

        // --- FITUR PENYAMBUNG VIDEO BACKGROUND ---
        document.addEventListener("DOMContentLoaded", () => {
            const bgVideo = document.querySelector('.video-bg');
            if (bgVideo) {
                const savedTime = sessionStorage.getItem('bgVideoTime');
                if (savedTime !== null) bgVideo.currentTime = parseFloat(savedTime);
                window.addEventListener('beforeunload', () => {
                    sessionStorage.setItem('bgVideoTime', bgVideo.currentTime);
                });
            }
        });

        // 1. Cek Sesi Login ke Server Supabase
        async function initAdminPage() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.replace("login.html");
                return;
            }

            // Tampilkan halaman karena sesi valid
            document.body.classList.remove('auth-checking');
            await fetchAndRenderTasks();
        }

        // 2. Ambil Data Proker dari Database Supabase
        async function fetchAndRenderTasks() {
            const container = document.getElementById('admin-task-container');
            container.innerHTML = `<p class="text-blue-200 col-span-full text-center">Memuat data proker...</p>`;

            const { data, error } = await supabaseClient
                .from('tasks')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                container.innerHTML = `<p class="text-red-400 col-span-full text-center">Gagal memuat data: ${error.message}</p>`;
                return;
            }

            allTasksFromDB = data;
            renderTasks(localStorage.getItem('preferredLang') || 'id');
        }

        // 3. Render ke Layar sesuai Bahasa
        window.updateLocalContent = function(lang) {
            renderTasks(lang);
        }

        function renderTasks(lang = 'id') {
            const container = document.getElementById('admin-task-container');
            container.innerHTML = "";

            const divisiOrder = ["Infocom", "Education", "Regeneration", "Olympic", "Public Relation"];

            divisiOrder.forEach(divisi => {
                const divTasks = allTasksFromDB
                    .filter(t => t.divisi === divisi)
                    .sort((a, b) => parseInt(a.id.split('-')[1]) - parseInt(b.id.split('-')[1]));

                if (divTasks.length === 0) return;

                let taskHtml = `
                <div class="admin-card p-6 transition transform hover:-translate-y-1">
                    <h2 class="text-xl font-black mb-5 text-blue-300 border-b border-white/10 pb-3 uppercase tracking-widest">${divisi}</h2>`;

                divTasks.forEach(task => {
                    const taskName = lang === 'en' ? task.nama_en : task.nama_id;
                    const isChecked = task.status_selesai;

                    taskHtml += `
                        <label class="task-item group">
                            <input type="checkbox" onchange="toggleTask('${task.id}', this.checked)" ${isChecked ? 'checked' : ''}>
                            <span class="${isChecked ? 'text-blue-400 line-through opacity-60' : 'text-blue-50 group-hover:text-white'} text-sm font-semibold tracking-wide transition">${taskName}</span>
                        </label>`;
                });

                taskHtml += `</div>`;
                container.innerHTML += taskHtml;
            });
        }

        // 4. Update Status Centang ke Database Supabase
        async function toggleTask(id, status) {
            const taskIndex = allTasksFromDB.findIndex(t => t.id === id);
            if (taskIndex !== -1) allTasksFromDB[taskIndex].status_selesai = status;
            renderTasks(localStorage.getItem('preferredLang') || 'id');

            const { error } = await supabaseClient
                .from('tasks')
                .update({ status_selesai: status })
                .eq('id', id);

            if (error) {
                alert("Gagal menyimpan perubahan ke server: " + error.message);
                await fetchAndRenderTasks();
            }
        }

        // 5. Reset Semua Status ke False di Database
        async function resetProgress() {
            const lang = localStorage.getItem('preferredLang') || 'id';
            const alertMsg = lang === 'id' ? "Hapus semua status terlaksana di database?" : "Clear all completed statuses in database?";
            
            if (confirm(alertMsg)) {
                const { error } = await supabaseClient
                    .from('tasks')
                    .update({ status_selesai: false })
                    .neq('id', '');

                if (error) {
                    alert("Gagal mereset data: " + error.message);
                } else {
                    await fetchAndRenderTasks();
                }
            }
        }

        // 6. Logout
        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.replace("login.html");
        }

        // Jalankan saat halaman dibuka
        initAdminPage();
    </script>
    <script src="js/translate.js"></script>
    <script src="js/script.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
