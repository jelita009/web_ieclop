<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olympic Division - IECLOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animation.css" />
    
    <!-- Favicon / Tab Logo -->
    <link rel="icon" type="image/webp" href="img/logo_IECLOP.webp">
    <link rel="shortcut icon" type="image/webp" href="img/logo_IECLOP.webp">
    <link rel="apple-touch-icon" href="img/logo_IECLOP.webp">
    <style>
      .glass-card {
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        transform: translateZ(0);
      }
      .glass-card:hover {
        transform: translateY(-5px) translateZ(0);
        box-shadow: 0 10px 25px rgba(30, 58, 138, 0.5);
      }
      .line-connector {
        width: 2px;
        height: 40px;
        background: linear-gradient(to bottom, #1e3a8a, transparent);
        margin: 0 auto;
      }
      .status-tag {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
      }
      .done-status {
        background: rgba(30, 58, 138, 0.3);
        color: #93c5fd;
        border: 1px solid rgba(147, 197, 253, 0.3);
      }
      .hourglass-anim {
          animation: hourglassRotate 2s ease-in-out infinite;
      }

      @keyframes hourglassRotate {
          0% { transform: rotate(0deg); }
          50% { transform: rotate(180deg); }
          100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="text-white antialiased">
    <video autoplay muted loop playsinline preload="auto" controlsList="nodownload" disablePictureInPicture class="video-bg">
      <source src="video/VIDEO%20PROFIL%20UKM%20IECLOP%20PNL%20-%202026_2.mp4" type="video/mp4" />
    </video>
    <div class="overlay"></div>
    <main-navbar></main-navbar>
    
    <main class="max-w-6xl mx-auto px-6 pt-32 pb-12 relative z-10">
      <header class="text-center mb-16" data-aos="fade-up">
        <h1
          id="div-name"
          class="text-5xl md:text-6xl font-black uppercase tracking-tighter text-white mb-4"
        ></h1>
        
        <div class="w-20 h-1.5 bg-gradient-to-r from-blue-500 to-pink-500 mx-auto rounded-full mb-6"></div>
        
        <p
          id="div-desc"
          class="text-justify leading-[1.8] tracking-[0.02em] text-blue-100 max-w-2xl mx-auto text-lg opacity-90"
        ></p>
      </header>
      <section class="mb-24" data-aos="zoom-in" data-aos-delay="200">
        <div class="flex flex-col items-center">
          <!-- Kartu Kepala Divisi (Identik Struktur) -->
          <div
            class="card ketum relative bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-5 w-56 text-center transition duration-300 hover:-translate-y-2 hover:shadow-[0_10px_25px_rgba(30,58,138,0.6)] floating-card"
          >
            <div class="image-box w-28 h-28 mx-auto mb-3 rounded-full overflow-hidden border-4 border-[#1e3a8a]">
              <img
                id="leader-img"
                src=""
                class="w-full h-full object-cover object-top"
              />
            </div>
            <div class="info">
              <h3
                id="leader-name"
                class="font-bold text-center text-lg text-white leading-tight"
              ></h3>
              <p
                data-i18n="headOfDiv"
                class="text-blue-300 text-[10px] font-black uppercase tracking-[0.2em] mt-2"
                >KEPALA DIVISI</p
              >
            </div>
          </div>
          <div class="line-connector"></div>
          <!-- Grid Anggota -->
          <div
            class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"
            id="members-grid"
          ></div>
        </div>
      </section>
      <section>
        <h2 class="text-2xl font-black mb-8 flex items-center gap-3 text-white">
          <i class="fa-solid fa-list-check text-[#3b82f6]"></i>
          <span data-i18n="prokerTitle">PROGRAM KERJA</span>
        </h2>
        <div class="grid gap-4" id="public-task-container"></div>
      </section>
    </main>

    <main-footer></main-footer>

    <script>
      const divisionDetails = {
        Olympic: {
          leader: "Ghina Najwa Ilmi",
          leaderImg: "img/kadiv-olim.webp",
          members: [
            { name: "Nazril Kanahaya Akbar", img: "img/olympic/Nazril.webp" },
            { name: "Syarifah Rizkiah", img: "img/olympic/Syarifah.webp" },
            { name: "Shafa Naya Naysyla", img: "img/olympic/Shafa.webp" },
            { name: "Najwa Sabrina", img: "img/olympic/Najwa.webp" },
            { name: "Muhammad Azhar Refandi", img: "img/olympic/azhar.webp" },
            { name: "Raisha Fathia", img: "img/olympic/Raisha.webp" },
            { name: "Lisa Agustin Nasution", img: "img/olympic/Lisa.webp" },
            { name: "Raisa Amanda Putri", img: "img/olympic/Raisa.webp" },
            { name: "Reza Mauliza", img: "img/olympic/Reza.webp" },
            { name: "Mutyara Assyifa", img: "img/olympic/Mutyara.webp" },
            { name: "Salsabila Harahap", img: "img/olympic/Salsabila.webp" },
            { name: "Cindi Vioni", img: "img/olympic/cindi.webp" },
            { name: "Delga Roja", img: "img/olympic/Delga.webp" },
            { name: "Kisna Sabfrida", img: "img/olympic/Kisna.webp" }
          ],
          id: {
            desc: "Mengembangkan minat serta bakat mahasiswa di berbagai ajang perlombaan melalui kegiatan Olympic Practice (OPRA).",
            tasks: [
              "Juara IEClop",
              "Jaringan Juara IEClop",
              "Komunitas Olimpiade",
              "Gudang Pengetahuan",
              "Latihan Olimpiade",
            ],
          },
          en: {
            desc: "Developing students' interests and talents in various competitions through Olympic Practice (OPRA) activities.",
            tasks: [
              "IEClop Champion",
              "IEClop Champion Link",
              "Olympic Society",
              "Store of Knowledge",
              "Olympic Practice",
            ],
          },
        },
      };
      const params = new URLSearchParams(window.location.search);
      const divName = params.get("name") || "Olympic";
      const data =
        divisionDetails[divName] || Object.values(divisionDetails)[0];

      function init() {
        if (!data) return;
        document.getElementById("div-name").innerText = divName.toUpperCase();
        document.getElementById("leader-name").innerText = data.leader;
        document.getElementById("leader-img").src = data.leaderImg;

        const memberGrid = document.getElementById("members-grid");
        memberGrid.innerHTML = "";

        data.members.forEach((m, index) => {
          // Cek apakah namanya mengandung Nazril untuk label Sekretaris
          const roleLabel = m.name.includes("Nazril")
            ? `<p class="text-blue-300 text-xs font-semibold uppercase tracking-wider mt-1">Sekretaris</p>`
            : "";

          const delay = (0.2 + index * 0.08).toFixed(2);

          memberGrid.innerHTML += `
                <div class="card divisi relative bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-4 min-w-[140px] text-center transition duration-300 hover:-translate-y-2 hover:scale-105 hover:shadow-[0_10px_20px_rgba(30,58,138,0.6)] member-pop-card group cursor-pointer" style="animation-delay: ${delay}s;">
                    <div class="image-box w-20 h-20 mx-auto mb-3 rounded-full overflow-hidden border-2 border-[#1e3a8a] group-hover:border-blue-400 group-hover:scale-110 transition duration-300">
                        <img src="${m.img}" onerror="this.src='img/logo_IECLOP.webp'" class="w-full h-full object-cover object-top">
                    </div>
                    <div class="info">
                        <h3 class="font-bold text-sm text-white group-hover:text-blue-200 leading-tight transition">${m.name}</h3>
                        ${roleLabel}
                    </div>
                </div>`;
        });

        const savedLang = localStorage.getItem("preferredLang") || "id";
        window.updateLocalContent(savedLang);
      }

      window.updateLocalContent = function (lang) {
        if (!data) return;
        const langData = data[lang] || data["id"];
        document.getElementById("div-desc").innerText = langData.desc;
        const container = document.getElementById("public-task-container");
        container.innerHTML = "";
        langData.tasks.forEach((task, index) => {
          const taskId = `${divName}-${index}`;
          const isDone = localStorage.getItem(taskId) === "true";
          const statusText = isDone
            ? lang === "id"
              ? "SUDAH TERLAKSANA"
              : "COMPLETED"
            : lang === "id"
              ? "BELUM TERLAKSANA"
              : "COMING SOON";
          container.innerHTML += `
                <div class="glass-card p-6 flex items-center justify-between group transition">
                    <div class="flex items-center gap-5">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center ${isDone ? "bg-[#1e3a8a] text-blue-200" : "bg-white/10 text-gray-400"} border border-white/10">
                            <i class="fa-solid ${isDone ? "fa-check-double" : "fa-hourglass-half hourglass-anim"}"></i>
                        </div>
                        <h4 class="text-lg font-bold ${isDone ? "text-gray-400" : "text-white"}">${task}</h4>
                    </div>
                    <span class="status-tag ${isDone ? "done-status" : "pending-status"}">${statusText}</span>
                </div>`;
        });
      };
      init();
    </script>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
    
    <script src="js/translate.js"></script>
    <script src="js/navbar.js?v=2"></script>
    <script src="js/footer.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
