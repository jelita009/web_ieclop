<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galery - UKM IECLOP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/memoryPage.css">
    <link rel="stylesheet" href="animation.css">
</head>
<body class="text-white antialiased">
    
    <!-- Background Video -->
    <video autoplay muted loop playsinline class="video-bg">
        <source src="video/contoh.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <main-navbar class="relative z-[100]"></main-navbar>

    <section class="memory-container relative z-10 pt-32 pb-16 px-4 min-h-screen">
        
        <!-- BAGIAN JUDUL DISINKRONKAN DENGAN FORMAT ABOUT -->
        <div class="memory-header text-center mb-16" data-aos="fade-up">
            <h1 class="text-5xl md:text-6xl font-black uppercase tracking-tighter text-white mb-4" data-i18n="memoryTitle">
                GALERY <span class="text-blue-300">BERSAMA KAMI</span>
            </h1>
            
            <!-- Garis gradient diletakkan di Bawah Judul -->
            <div class="w-20 h-1.5 bg-gradient-to-r from-blue-500 to-pink-500 mx-auto rounded-full mb-6"></div>
            
            <p class="text-center text-blue-100 max-w-2xl mx-auto text-lg leading-relaxed opacity-90" data-i18n="memoryDesc">
                Klik pada tema di bawah ini untuk melihat koleksi foto lengkap setiap momen.
            </p>
        </div>

        <!-- Gallery Grid -->
        <div class="gallery-grid max-w-7xl mx-auto">
            
            <!-- TEMA: MOMEN 2024 -->
            <a href="Galery/momen2024.html" class="gallery-item potrait relative overflow-hidden rounded-2xl border border-white/10 shadow-lg group cursor-pointer block" data-aos="fade-up" data-aos-delay="100">
                <img src="img/memories/P24.JPG" alt="Momen 2024" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="item-overlay absolute inset-0 bg-[#0a1536]/80 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-sm">
                    <span class="text-white font-bold tracking-widest uppercase text-sm border border-blue-400 px-6 py-2 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.5)]" data-i18n="memTag1">LIHAT MOMEN 2024</span>
                </div>
            </a>
            
            <!-- TEMA: KEGIATAN -->
            <a href="Galery/kegiatan.html" class="gallery-item lanscape relative overflow-hidden rounded-2xl border border-white/10 shadow-lg group cursor-pointer block" data-aos="fade-up" data-aos-delay="200">
                <img src="img/memories/L21.JPG" alt="Kegiatan" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="item-overlay absolute inset-0 bg-[#0a1536]/80 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-sm">
                    <span class="text-white font-bold tracking-widest uppercase text-sm border border-blue-400 px-6 py-2 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.5)]" data-i18n="memTag2">LIHAT KEGIATAN</span>
                </div>
            </a>
            
            <!-- TEMA: DOKUMENTASI -->
            <a href="Galery/dokumentasi.html" class="gallery-item potrait relative overflow-hidden rounded-2xl border border-white/10 shadow-lg group cursor-pointer block" data-aos="fade-up" data-aos-delay="300">
                <img src="img/memories/P25.JPG" alt="Dokumentasi" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="item-overlay absolute inset-0 bg-[#0a1536]/80 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-sm">
                    <span class="text-white font-bold tracking-widest uppercase text-sm border border-blue-400 px-6 py-2 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.5)]" data-i18n="memTag3">DOKUMENTASI</span>
                </div>
            </a>
            
            <!-- TEMA: FOTO BERSAMA -->
            <a href="Galery/foto-bersama.html" class="gallery-item lanscape relative overflow-hidden rounded-2xl border border-white/10 shadow-lg group cursor-pointer block" data-aos="fade-up" data-aos-delay="400">
                <img src="img/memories/L22.JPG" alt="Foto Bersama" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="item-overlay absolute inset-0 bg-[#0a1536]/80 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-sm">
                    <span class="text-white font-bold tracking-widest uppercase text-sm border border-blue-400 px-6 py-2 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.5)]" data-i18n="memTag4">FOTO BERSAMA</span>
                </div>
            </a>
            
            <!-- TEMA: TIM -->
            <a href="Galery/tim.html" class="gallery-item potrait relative overflow-hidden rounded-2xl border border-white/10 shadow-lg group cursor-pointer block" data-aos="fade-up" data-aos-delay="500">
                <img src="img/memories/P28.JPG" alt="Tim" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="item-overlay absolute inset-0 bg-[#0a1536]/80 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-sm">
                    <span class="text-white font-bold tracking-widest uppercase text-sm border border-blue-400 px-6 py-2 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.5)]" data-i18n="memTag5">STRUKTUR TIM</span>
                </div>
            </a>
            
            <!-- TEMA: WORKSHOP -->
            <a href="Galery/workshop.html" class="gallery-item lanscape relative overflow-hidden rounded-2xl border border-white/10 shadow-lg group cursor-pointer block" data-aos="fade-up" data-aos-delay="600">
                <img src="img/memories/L29.JPG" alt="Workshop" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="item-overlay absolute inset-0 bg-[#0a1536]/80 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-sm">
                    <span class="text-white font-bold tracking-widest uppercase text-sm border border-blue-400 px-6 py-2 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.5)]" data-i18n="memTag6">WORKSHOP</span>
                </div>
            </a>
        </div>
    </section>

    <!-- Bingkai Footer Otomatis -->
    <main-footer></main-footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
    <script src="translate.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="script.js"></script>
</body>
</html>
